# =====================================================================
# TP 6 - Spring Boot et Swagger
# Etape 3 : configuration de la base de donnees MySQL / MariaDB
# =====================================================================
spring.application.name=student-management
server.port=8080

# --- Source de donnees -----------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/studentdb?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate -------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Format des dates dans le JSON -----------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Paris

# --- Spring Data REST (starter demande par l'enonce) -----------------
# Seuls les repositories annotes @RepositoryRestResource sont exposes,
# StudentController garde donc la main sur /students.
spring.data.rest.base-path=/api
spring.data.rest.detection-strategy=annotated
spring.data.rest.default-media-type=application/json

# --- Swagger / springdoc-openapi -------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
